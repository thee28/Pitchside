# Render Blueprint for the Pitchside backend + database.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# The frontend is hosted elsewhere; set CORS_ORIGINS to its URL (see below).
databases:
  # NOTE: a free database is deleted 30 days after creation. Bump this to a paid
  # plan here at the same time you upgrade it in the dashboard — if the two ever
  # disagree, a Blueprint re-sync tries to apply whatever this file says.
  - name: pitchside-db
    plan: free
    databaseName: pitchside
    user: pitchside

services:
  - type: web
    name: pitchside-api
    runtime: python
    # Starter, not free: free web services sleep after ~15 min idle and cold-start
    # at ~50s. Must match the dashboard or a Blueprint re-sync will downgrade it.
    plan: starter
    rootDir: backend
    # Install deps, create schema, then load the real tournament (ETL_SOURCE=api,
    # offline from the committed cache). Runs once per deploy, so no request ever
    # hits a mid-load empty table.
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python -m etl.load
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pitchside-db
          property: connectionString
      - key: ETL_SOURCE
        value: api
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Set to the deployed frontend origin, e.g. https://pitchside.vercel.app
      # No trailing slash. Comma-separate multiple origins.
      - key: CORS_ORIGINS
        sync: false
