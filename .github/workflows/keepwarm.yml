name: keep-warm

# Pings the backend health endpoint so Render's free web service does not spin
# down (it sleeps after ~15 min idle, giving the next visitor a ~50s cold start).
# GitHub disables scheduled workflows after 60 days with no repo activity, and
# cron timing is best-effort, not exact.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/health
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 90 \
            https://pitchside-api-x7py.onrender.com/api/health
